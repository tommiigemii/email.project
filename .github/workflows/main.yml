name: Daily Email

on:
  schedule:
    - cron: "0 5 * * *" 
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-email
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ✅ NUOVO STEP (AGGIUNTO)
      - name: Genera HTML con immagine random
        run: python generate_email.py

      - name: Parse EMAIL_DATA + sanity check + send (bulletproof)
        shell: bash
        env:
          EMAIL_DATA: ${{ secrets.EMAIL_DATA }}
        run: |
          python - <<'PY'
          import os, sys, subprocess

          data = os.getenv("EMAIL_DATA", "")
          if not data.strip():
              raise SystemExit("Missing secret: EMAIL_DATA (empty or not set)")

          # Parse
          for i, raw in enumerate(data.splitlines(), start=1):
              line = raw.strip().replace("\r", "")
              if not line or line.startswith("#"):
                  continue
              if "=" not in line:
                  raise SystemExit(f"EMAIL_DATA invalid at line {i}: missing '='")
              key, val = line.split("=", 1)
              key = key.strip()
              val = val.strip()
              if not key:
                  raise SystemExit(f"EMAIL_DATA invalid at line {i}: empty key")
              os.environ[key] = val

          # ✅ FORZIAMO IL TEMPLATE GENERATO
          os.environ["EMAIL_BODY_FILE"] = "output_email.html"

          # Sanity check
          must = ["EMAIL_USER", "EMAIL_PASS", "EMAIL_SUBJECT", "LINK_3D"]
          missing = [k for k in must if not os.getenv(k)]

          if not (os.getenv("EMAIL_RECIPIENT") or os.getenv("EMAIL_RECIPIENTS")):
              missing.append("EMAIL_RECIPIENTS (or EMAIL_RECIPIENT)")

          if not os.getenv("EMAIL_BODY_FILE"):
              missing.append("EMAIL_BODY_FILE")

          if missing:
              raise SystemExit(f"Missing env vars: {missing}")

          # Check file template
          body_file = os.getenv("EMAIL_BODY_FILE")
          if not os.path.isfile(body_file):
              raise SystemExit(f"Template file not found: {body_file}")

          # Check script exists
          script = "email.addresser/email.addresser.py"
          if not os.path.isfile(script):
              raise SystemExit(f"Missing script: {script}")

          print("OK: env parsed + HTML generato. Sending...")
          subprocess.run([sys.executable, script], check=True, env=os.environ)
          PY
